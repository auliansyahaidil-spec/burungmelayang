<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burung Melayang</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="menu">

<img src="images/logo.png" class="logo">

<h1>BURUNG MELAYANG</h1>

<button onclick="startGame()">Mulai Bermain</button>

<button onclick="showLevel()">Pilih Level</button>

<button onclick="showHelp()">Cara Bermain</button>

<button onclick="exitGame()">Keluar</button>

</div>

<div id="levelMenu" class="hidden">

<h2>Pilih Level</h2>

<button onclick="chooseLevel(1)">Level 1</button>
<button onclick="chooseLevel(2)">Level 2</button>
<button onclick="chooseLevel(3)">Level 3</button>

<button onclick="backMenu()">
Kembali
</button>

</div>

<div id="helpMenu" class="hidden">

<h2>Cara Bermain</h2>

<p>

Klik layar atau tekan tombol SPASI agar burung terbang.

Hindari seluruh rintangan.

Semakin tinggi level semakin cepat permainan.

</p>

<button onclick="backMenu()">
Kembali
</button>

</div>

<canvas id="gameCanvas" width="480" height="720"></canvas>

<script src="script.js"></script>

</body>
</html>
<div id="gameArea" style="display:none;">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div style="margin-top:10px;">
        <span>Skor : <span id="score">0</span></span>
    </div>
</div>
<button onclick="startGame()">Mulai Bermain</button>
<script src="game.js"></script>
<button onclick="pilihLevel(1)">Level 1</button>
<button onclick="pilihLevel(2)">Level 2</button>
<button onclick="pilihLevel(3)">Level 3</button>
